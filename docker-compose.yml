
services:
  backend:
    build:
      context: ./backend
    image: containerized-flask-backend:latest
    container_name: containerized-flask-backend
    environment:
      APP_NAME: ContainerCloud
      APP_ENV: development
      PORT: "5000"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: containerized-flask-frontend:latest
    container_name: containerized-flask-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped